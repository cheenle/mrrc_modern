  <text x="480" y="46" fill="#e6e6e6" font-size="22" font-weight="600" text-anchor="middle">MRRC Modern · Android v1.0.0 — 界面原型</text>
  <text x="480" y="70" fill="#8a8f98" font-size="12.5" text-anchor="middle">按实际 Compose 布局绘制：MainScreen.kt / RecordingPanel.kt（v1.0.0）</text>

