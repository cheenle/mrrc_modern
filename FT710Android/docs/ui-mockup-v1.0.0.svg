<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" font-family="-apple-system,'PingFang SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="wf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3a1f00"/>
      <stop offset="35%"  stop-color="#8a4a00"/>
      <stop offset="60%"  stop-color="#ffb000"/>
      <stop offset="80%"  stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#301a00"/>
    </linearGradient>
    <linearGradient id="wf2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1a1206"/>
      <stop offset="30%"  stop-color="#5c3300"/>
      <stop offset="55%"  stop-color="#e08a00"/>
      <stop offset="70%"  stop-color="#ffc24d"/>
      <stop offset="100%" stop-color="#241503"/>
