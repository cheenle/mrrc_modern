name: FT710Mobile
options:
  bundleIdPrefix: com.hamradio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    INFOPLIST_FILE: Resources/Info.plist
    DEVELOPMENT_TEAM: "VQ89MM7935"

schemes:
  FT710Mobile:
    build:
      targets:
        FT710Mobile: all
    run:
      config: Debug
    test:
      config: Debug
  PTTManagerTests:
    build:
      targets:
        PTTManagerTests: all
    test:
      config: Debug
      targets:
        - PTTManagerTests

targets:
  FT710Mobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamradio.ft710mobile
        INFOPLIST_FILE: Resources/Info.plist
        SUPPORTED_PLATFORMS: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        DEVELOPMENT_TEAM: "VQ89MM7935"
        CODE_SIGN_STYLE: Automatic
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Sources/Audio/opus-ios/include"
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/Sources/Audio/opus-ios/lib"
        OTHER_LDFLAGS: "-lopus"
  PTTManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Sources/PTT
      - path: Tests/FT710MobileTests/PTTManagerTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamradio.ft710mobile.pttmanagertests
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST: YES
