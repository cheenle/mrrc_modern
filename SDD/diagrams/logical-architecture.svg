<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker></defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.h{fill:#f0a030;font-size:11px;font-weight:600}.t{fill:#e0e0e0;font-size:10px}.m{fill:#888;font-size:9px}.c{fill:#5dade2;font-size:10px}</style>
  <!-- Browser -->
  <rect x="150" y="8" width="300" height="46" rx="8" fill="#f0a03014" stroke="#f0a03044"/>
