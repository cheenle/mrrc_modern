  <text x="300" y="126" text-anchor="middle" class="m">/api/mem_channels · /api/status · /api/auth/*</text>
  <line x1="300" y1="140" x2="300" y2="156" stroke="#888" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="315" y="154" class="c">in-process imports</text>
