<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <!-- diagram-version: V2.46 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker>
  </defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.b{fill:#e0e0e0;font-size:12px;font-weight:600}.h{fill:#f0a030;font-size:11px;font-weight:700;letter-spacing:.06em}.m{fill:#999;font-size:10px}.s{fill:#777;font-size:9px}</style>

  <text x="380" y="18" text-anchor="middle" class="b">Spectrum Paths — three sources, one waterfall (SDD V2.46)</text>

  <!-- FT4222 -->
  <rect x="12" y="32" width="238" height="196" rx="10" fill="#22c55e18" stroke="#22c55e55"/>
  <text x="131" y="50" text-anchor="middle" class="h">FT-710 · FT4222 SPI</text>
  <text x="131" y="68" text-anchor="middle" class="m">real FFT data, verified</text>
  <text x="26" y="90" class="m">FT4222 SPI · 4096-byte reads</text>
  <text x="26" y="106" class="m">scope_pipe.py subprocess</text>
  <text x="26" y="122" class="m">ctypes → libft4222</text>
  <text x="26" y="138" class="m">stdout pipe: 4B BE len + payload</text>
  <text x="26" y="154" class="m">1 s len=0 heartbeat (dead-parent)</text>
  <text x="26" y="170" class="m">stdin TX:1 / TX:0 pause</text>
  <text x="26" y="186" class="m">resync = close / settle / reopen</text>
  <text x="131" y="208" text-anchor="middle" class="m">→ wf1[850] + wf2[850]</text>
  <text x="131" y="222" text-anchor="middle" class="s">broadcast: v1 851 B · v2 1701 B</text>

  <!-- CI-V 0x27 -->
  <rect x="261" y="32" width="238" height="196" rx="10" fill="#5dade218" stroke="#5dade255"/>
  <text x="380" y="50" text-anchor="middle" class="h">Icom · CI-V 0x27</text>
  <text x="380" y="68" text-anchor="middle" class="m">in-band waveform on the CAT port</text>
  <text x="275" y="90" class="m">startup/reconnect: 27 10 01 (display ON)</text>
  <text x="275" y="106" class="m">+ center mode, span, then 27 11 01</text>
  <text x="275" y="122" class="m">0x27 00 frames → civ_controller demux</text>
  <text x="275" y="138" class="m">profile geometry: 475×11 or 689×15 bins</text>
  <text x="275" y="154" class="m">bounded newest-data queue (44 segments)</text>
  <text x="275" y="170" class="m">amp ceiling from the profile → 255</text>
  <text x="275" y="186" class="m">upsample 850 → ScopeHandler</text>
  <text x="380" y="208" text-anchor="middle" class="m">→ wf1[850] (+ wf2 on the 689-bin models)</text>
  <text x="380" y="222" text-anchor="middle" class="s">IC-7300/MK2 verified · IC-705/7610/7760 experimental</text>

  <!-- Yaesu family: none + fallback -->
  <rect x="510" y="32" width="238" height="196" rx="10" fill="#f0a03018" stroke="#f0a03055"/>
  <text x="629" y="50" text-anchor="middle" class="h">Yaesu FTDX10/101D/101MP/FTX-1F</text>
  <text x="629" y="68" text-anchor="middle" class="m">no scope stream exists (AD-018)</text>
  <text x="524" y="90" class="m">SS; is a settings command only</text>
  <text x="524" y="106" class="m">(span / speed / mode) — no waveform</text>
  <text x="524" y="122" class="m">no vendor scope command in any CAT doc</text>
  <text x="524" y="138" class="m">Hamlib's Yaesu family: zero scope code</text>
  <text x="524" y="154" class="m">→ create_scope_producer() returns None</text>
  <text x="629" y="176" text-anchor="middle" class="m">S-meter fallback only</text>
  <text x="524" y="196" class="m">a real waterfall needs field captures of the</text>
  <text x="524" y="210" class="m">undocumented scope stream (phase 4)</text>
  <text x="629" y="224" text-anchor="middle" class="s">TX gated while unverified</text>

  <!-- Shared fallback + scheduler -->
  <rect x="12" y="238" width="736" height="52" rx="10" fill="#a78bfa18" stroke="#a78bfa55"/>
  <text x="380" y="256" text-anchor="middle" class="h">SHARED · S-meter synthesiser + 30 Hz scheduler</text>
  <text x="380" y="274" text-anchor="middle" class="m">CAT SM0; poll (~100 ms) → raw 0-255 → Gaussian peaks at band edges → same 851/1701-byte frame format → /WSspectrum</text>
  <text x="380" y="288" text-anchor="middle" class="s">the scheduler sends real scope data only when the frame counter advances, so a stale radio cannot freeze the waterfall</text>
</svg>
