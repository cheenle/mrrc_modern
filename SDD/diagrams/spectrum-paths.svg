<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f0a030"/></marker><marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5dade2"/></marker></defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.h{fill:#f0a030;font-size:11px;font-weight:600}.t{fill:#e0e0e0;font-size:9px}.m{fill:#888;font-size:8px}.b{fill:#5dade2;font-size:10px}</style>
  <!-- FT4222 Path -->
  <text x="16" y="20" fill="#f0a030" font-size="13" font-weight="700">FT4222 Path (Real FFT Data)</text>
  <rect x="16" y="32" width="160" height="50" rx="6" fill="#f0a03010" stroke="#f0a03033"/>
  <text x="96" y="52" text-anchor="middle" class="h">FT-710 FT4222 SPI</text>
  <text x="96" y="68" text-anchor="middle" class="m">4096-byte SPI reads</text>
  <line x1="176" y1="57" x2="204" y2="57" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="208" y="32" width="160" height="50" rx="6" fill="#5dade210" stroke="#5dade233"/>
  <text x="288" y="52" text-anchor="middle" class="h">scope_pipe.py subprocess</text>
  <text x="288" y="68" text-anchor="middle" class="m">ctypes → libft4222</text>
  <line x1="368" y1="57" x2="396" y2="57" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="400" y="32" width="160" height="50" rx="6" fill="#a78bfa10" stroke="#a78bfa33"/>
  <text x="480" y="52" text-anchor="middle" class="h">stdout pipe</text>
  <text x="480" y="68" text-anchor="middle" class="m">4B BE len + payload</text>
  <line x1="560" y1="57" x2="588" y2="57" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="492" y="100" width="160" height="50" rx="6" fill="#22c55e10" stroke="#22c55e33"/>
  <text x="572" y="120" text-anchor="middle" class="h">parse → broadcast</text>
  <text x="572" y="136" text-anchor="middle" class="m">wf1[850] + wf2[850]</text>
  <line x1="572" y1="82" x2="572" y2="100" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="492" y="168" width="160" height="30" rx="6" fill="#88888810" stroke="#88888822"/>
  <text x="572" y="186" text-anchor="middle" class="m">stderr → STATUS: logs</text>
  <line x1="572" y1="150" x2="572" y2="168" stroke="#888" stroke-width="1" marker-end="url(#ar)"/>

  <!-- S-Meter Fallback -->
  <text x="16" y="230" fill="#f0a030" font-size="13" font-weight="700">S-Meter Fallback (Synthetic Spectrum)</text>
  <rect x="16" y="242" width="160" height="50" rx="6" fill="#f0a03010" stroke="#f0a03033"/>
  <text x="96" y="262" text-anchor="middle" class="h">CAT SM0; poll · 100ms</text>
  <text x="96" y="278" text-anchor="middle" class="m">S-meter value 0–255</text>
  <line x1="176" y1="267" x2="204" y2="267" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="208" y="242" width="180" height="50" rx="6" fill="#5dade210" stroke="#5dade233"/>
  <text x="298" y="262" text-anchor="middle" class="h">scope_handler.py</text>
  <text x="298" y="278" text-anchor="middle" class="m">Gaussian peaks @ band edges</text>
  <line x1="388" y1="267" x2="416" y2="267" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="420" y="242" width="160" height="50" rx="6" fill="#a78bfa10" stroke="#a78bfa33"/>
  <text x="500" y="262" text-anchor="middle" class="h">v1 (851B) / v2 (1701B)</text>
  <text x="500" y="278" text-anchor="middle" class="m">Same format as FT4222</text>
  <line x1="580" y1="267" x2="620" y2="267" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="504" y="310" width="150" height="30" rx="6" fill="#22c55e10" stroke="#22c55e33"/>
  <text x="579" y="329" text-anchor="middle" class="h">/WSspectrum broadcast</text>

  <!-- Spectrum info -->
  <rect x="16" y="330" width="460" height="40" rx="6" fill="#f0a03008" stroke="#f0a03022"/>
  <text x="246" y="348" text-anchor="middle" class="t">Dual-mode spectrum: FT4222 SPI (real FFT) with automatic S-meter Gaussian fallback when FTDI unavailable</text>
  <text x="246" y="362" text-anchor="middle" class="m">Same binary format both paths · browser waterfall renders identically · ~30 fps broadcast</text>
</svg>
