<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 1226" width="470" height="1226" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- diagram-version: V3.04 -->
  <defs>
    <style>
      .panel { fill:#22262c; }
      .border { stroke:#33383f; stroke-width:1; }
      .row { fill:#2a2e35; stroke:#3d434c; stroke-width:1; }
      .txt { fill:#e6e6e6; font-size:13px; }
      .txt-sm { fill:#9aa0a8; font-size:10.5px; }
      .lbl { fill:#c9ced6; font-size:11px; }
