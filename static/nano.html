<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12120f">
<title>天线诊断 · NanoVNA</title>
<style>
:root{
  --bg:#12120f; --bg2:#1c1b17; --card:#26241e;
  --fg:#f2eee2; --dim:#a49c8a; --muted:#6f695c;
  --accent:#f5a623; --ok:#2fbf5f; --warn:#e8b529; --bad:#e8563f;
  --line:#3a382f; --r:14px;
  --mono:'SF Mono',Menlo,Monaco,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  -webkit-text-size-adjust:100%;
}
header{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--bg2); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:10;
}
header .t{font-weight:700; letter-spacing:.05em}
header .meta{font-family:var(--mono); font-size:11px; color:var(--dim);
  flex:1; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#banner{display:none; padding:9px 14px; font-size:13px; text-align:center; font-weight:700}
#banner.show{display:block}
#banner.warn{background:var(--warn); color:#1a1a1a}
#banner.bad{background:var(--bad); color:#fff}
main{padding:12px 14px 48px; max-width:760px; margin:0 auto}

/* 判定卡：野外一眼看完 */
.verdict{background:var(--card); border-radius:var(--r); padding:16px 16px 14px;
  border:1px solid var(--line); margin-bottom:12px}
.verdict .band{display:flex; align-items:baseline; gap:10px}
.verdict .band b{font-size:20px; letter-spacing:.04em}
.verdict .chip{margin-left:auto; font-size:13px; font-weight:800; padding:5px 12px;
  border-radius:999px; background:#3a382f; color:var(--fg)}
.chip.ok{background:rgba(47,191,95,.18); color:var(--ok); border:1px solid var(--ok)}
.chip.warn{background:rgba(232,181,41,.18); color:var(--warn); border:1px solid var(--warn)}
.chip.bad{background:rgba(232,86,63,.18); color:var(--bad); border:1px solid var(--bad)}
.big{display:flex; gap:18px; margin-top:10px; align-items:flex-end; flex-wrap:wrap}
.big .item small{display:block; font-size:11px; color:var(--muted); letter-spacing:.08em}
.big .item span{font-family:var(--mono); font-variant-numeric:tabular-nums}
.big .swr span{font-size:46px; line-height:1; font-weight:800}
.big .z span{font-size:22px; line-height:1.2}
.big .f span{font-size:16px}
.trim{margin-top:12px; padding:10px 12px; border-radius:10px; font-size:14px;
  line-height:1.6; background:rgba(245,166,35,.10); border:1px solid rgba(245,166,35,.35)}
.trim b{color:var(--accent)}
.trim.crit{background:rgba(232,86,63,.10); border-color:rgba(232,86,63,.4)}

canvas{width:100%; height:260px; display:block; background:var(--bg2);
  border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px}
#tip{position:fixed; pointer-events:none; z-index:50; display:none;
  background:rgba(18,18,15,.96); border:1px solid var(--accent); border-radius:9px;
  padding:7px 10px; font-family:var(--mono); font-size:12px; line-height:1.55;
  color:var(--fg); white-space:pre; box-shadow:0 6px 20px rgba(0,0,0,.6)}

.bands{display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; -webkit-overflow-scrolling:touch}
.bands button{
  flex:0 0 auto; min-width:66px; padding:12px 14px; font-size:15px; font-weight:700;
  border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--dim);
}
.bands button.on{background:var(--accent); border-color:var(--accent); color:#161512}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
button.primary{
  flex:1; min-width:140px; padding:16px; font-size:17px; font-weight:800;
  border:0; border-radius:12px; background:var(--accent); color:#161512;
}
button.primary:disabled{opacity:.45}
button.ghost{background:var(--card); color:var(--fg); border:1px solid var(--line);
  border-radius:10px; padding:12px 14px; font-size:14px}
#readout{font-family:var(--mono); font-size:12px; color:var(--dim);
  white-space:pre-line; min-height:2.4em; margin-bottom:6px}
details{background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  margin-top:12px; padding:0 14px}
details>summary{padding:13px 0; font-size:14px; color:var(--dim); cursor:pointer; list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:'▸ '; color:var(--accent)}
details[open]>summary:before{content:'▾ '}
h3{font-size:12px; color:var(--accent); letter-spacing:.08em; margin:16px 0 8px}
.kv{display:grid; grid-template-columns:auto 1fr; gap:5px 12px;
  font-family:var(--mono); font-size:12px; padding-bottom:10px}
.kv dt{color:var(--dim)} .kv dd{margin:0; text-align:right}
.setting{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:13px}
.setting label{flex:1; color:var(--dim)}
select,input[type=number],input[type=text]{
  background:var(--bg2); color:var(--fg); border:1px solid var(--line);
  border-radius:8px; padding:9px 10px; font-size:14px; font-family:var(--mono);
}
.hint{font-size:11px; color:var(--muted); line-height:1.7; margin:8px 0}
#sweeps{list-style:none; padding:0; margin:0 0 12px}
#sweeps li{display:flex; align-items:center; gap:8px; padding:10px 0;
  border-bottom:1px solid var(--line); font-size:12px}
#sweeps li .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#sweeps li button{background:transparent; border:1px solid var(--line);
  color:var(--dim); border-radius:6px; padding:6px 10px; font-size:11px}
</style>
</head>
<body>
<header>
  <span class="t">天线诊断</span>
  <span class="meta" id="meta">连接中…</span>
</header>
<div id="banner"></div>
<div id="tip"></div>

<main>
  <div class="verdict" id="verdict">
    <div class="band"><b id="v-band">—</b>
      <span class="chip" id="v-chip">未扫描</span></div>
    <div class="big">
      <div class="item swr"><small>驻波 SWR</small><span id="v-swr">—</span></div>
      <div class="item z"><small>阻抗 Z</small><span id="v-z">—</span></div>
      <div class="item f"><small>谐振点</small><span id="v-f">—</span></div>
    </div>
    <div class="trim" id="v-trim">选一个波段，按「扫描」——1 秒出结果。</div>
  </div>

  <canvas id="plot" height="260"></canvas>

  <div class="bands" id="bands"></div>

  <div class="row">
    <button class="primary" id="scan">扫描</button>
    <button class="ghost" id="baseline">存为基准</button>
  </div>
  <div id="readout">驻波 ≤1.5 免调可用 · ≤2.0 天调可修 · &gt;3.0 不建议用</div>

  <details>
    <summary>自定义频段 / 扫描点数</summary>
    <div class="row">
      <label>中心</label><input type="number" id="center" step="0.01" placeholder="MHz" style="width:92px">
      <label>带宽</label><input type="number" id="span" step="0.01" placeholder="MHz" style="width:92px">
      <button class="ghost" id="apply-freq">应用</button>
    </div>
    <div class="row">
      <label>点数</label>
      <select id="points">
        <option value="101">101（0.3 秒）</option>
        <option value="201">201（0.6 秒）</option>
        <option value="401" selected>401（1.0 秒）</option>
      </select>
    </div>
  </details>

  <details>
    <summary>保存的扫描（对比修剪前后）</summary>
    <div class="row">
      <input type="text" id="label" placeholder="标签，如「修剪前」" style="flex:1">
      <button class="ghost" id="save">保存</button>
    </div>
    <ul id="sweeps"><li>还没有存过扫描</li></ul>
    <div class="row">
      <button class="ghost" id="exportCsv">导出 CSV</button>
      <button class="ghost" id="exportS1p">导出 s1p</button>
    </div>
  </details>

  <details>
    <summary>设备</summary>
    <dl class="kv" id="devinfo"><dt>状态</dt><dd>—</dd></dl>
    <h3>测量</h3>
    <div id="settings"><p class="hint">连上设备后可改。</p></div>
    <h3>设备屏幕</h3>
    <div id="view"><p class="hint">读取中…</p></div>
    <div id="flags"><p class="hint">读取中…</p></div>
    <p class="hint">这些开关在固件里没有查询命令，显示的是本页记下的状态，实际以设备屏幕为准。</p>
    <div class="row"><button class="ghost" id="saveconfig">写入设备 flash</button></div>
    <p class="hint">设备上的设置只存在 RAM，断电回默认——改完点这里才真正保存（含标定）。</p>
    <h3>标定</h3>
    <div class="row" id="cal"></div>
    <p class="hint">recall 立即生效；save 会覆盖设备里那一组，需要确认。</p>
    <h3>固件升级</h3>
    <div id="firmware"><p class="hint">读取中…</p></div>
  </details>
</main>

<script src="nano.js?v=3"></script>
</body>
</html>
