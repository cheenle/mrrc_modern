<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MRRC Modern · 单连接终端</title>
    <style>
      :root {
        --bg: #1a1a1a;
        --panel: #262626;
        --panel-border: #3a3a3a;
        --amber: #f59e0b;
        --amber-dim: #b45309;
        --text: #eee;
        --text-dim: #9ca3af;
        --danger: #ef4444;
        --ok: #22c55e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        padding-top: calc(6px + env(safe-area-inset-top));
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
        flex: 0 0 auto;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        color: var(--amber);
        font-weight: 600;
      }
      .badge {
        background: #2d2410;
        color: var(--amber);
        border: 1px solid var(--amber-dim);
        border-radius: 5px;
        font-size: 10px;
        padding: 1px 6px;
        white-space: nowrap;
      }
      #link-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--danger);
        flex: 0 0 auto;
      }
      #link-dot.on {
        background: var(--ok);
      }
      main {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .freq-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
      }
      #freq {
        font-size: 28px;
        font-weight: 700;
        color: var(--amber);
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
      }
      #mode {
        font-size: 13px;
        color: var(--text-dim);
      }
      .step-btn {
        background: #333;
        color: var(--text);
        border: 1px solid var(--panel-border);
        border-radius: 6px;
        font-size: 14px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .step-btn:active {
        background: var(--amber-dim);
      }
      .meter-wrap {
        padding: 6px 10px;
        background: var(--panel);
      }
      #meter-bar {
        height: 8px;
        background: #111;
        border-radius: 4px;
        overflow: hidden;
      }
      #meter-fill {
        height: 100%;
        width: 0%;
        background: var(--amber);
      }
      #meter-label {
        font-size: 11px;
        color: var(--text-dim);
        margin-top: 2px;
      }
      canvas {
        width: 100%;
        display: block;
        background: #000;
      }
      #fft {
        height: 70px;
      }
      /* 画布内部只有 80 行（主界面 desktop 默认值），由 CSS 拉到剩余高度：
         每行 = 一块，滚动速度 = 帧率 × 每行像素数。内部行数做大了，同样的
         5.3 帧/秒就会显得极慢（见 terminal.js 顶部注释）。 */
      #waterfall {
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
      }
      .wf-wrap {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      footer {
        flex: 0 0 auto;
        background: var(--panel);
        border-top: 1px solid var(--panel-border);
        padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #ptt {
        flex: 1 1 auto;
        padding: 14px;
        border-radius: 10px;
        border: none;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 2px;
        background: #3a2f14;
        color: var(--amber);
        cursor: pointer;
        touch-action: none;
        user-select: none;
      }
      #ptt.live {
        background: var(--danger);
        color: #fff;
      }
      #vol {
        flex: 1 1 auto;
      }
      #stats {
        font-size: 10px;
        color: var(--text-dim);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #status {
        font-size: 11px;
        color: var(--amber);
        min-height: 14px;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="link-dot"></div>
      <h1>MRRC · 单连接</h1>
      <span class="badge" id="role-badge">operator</span>
      <span class="badge" id="profile-badge">spec: off</span>
      <span class="badge" id="online-badge">在线 0</span>
    </header>

    <main>
      <div class="freq-row">
        <button class="step-btn" id="step-minus" title="−1 kHz">−</button>
        <div>
          <div id="freq">—</div>
          <div id="mode">—</div>
        </div>
        <button class="step-btn" id="step-plus" title="+1 kHz">+</button>
        <select class="step-btn" id="mode-select" title="模式"></select>
      </div>

      <div class="meter-wrap">
        <div id="meter-bar"><div id="meter-fill"></div></div>
        <div id="meter-label">S —</div>
      </div>

      <canvas id="fft" width="850" height="70"></canvas>
      <div class="wf-wrap">
        <canvas id="waterfall" width="850" height="80"></canvas>
      </div>
    </main>

    <footer>
      <div class="row">
        <button id="ptt">PTT</button>
        <input
          type="range"
          id="vol"
          min="0"
          max="255"
          value="180"
          title="音量"
        />
      </div>
      <div id="status"></div>
      <div id="stats">连接中…</div>
    </footer>

    <script src="modules/opus_wasm.js"></script>
    <script src="modules/opus_codec.js"></script>
    <script src="modules/ptt_manager.js"></script>
    <script src="terminal.js?v=4"></script>
  </body>
</html>
