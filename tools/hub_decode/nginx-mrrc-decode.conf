# FT8 cloud deep path (design A1) — insert inside the server block that
# terminates TLS for www.vlsc.net, then `nginx -t && systemctl reload nginx`.
#
# The endpoint is token-authenticated and used by one box; it is not part of
# the public UI.  `exact` match, so nothing else can be reached through it.
location = /mrrc-decode {
    proxy_pass http://127.0.0.1:8990;
    proxy_http_version 1.1;
    # Required: without it nginx would buffer the 360 KB slot body before the
    # service ever sees it, and the request would lose its meaning as a
    # deadline-bounded decode.
    proxy_buffering off;
    proxy_request_buffering off;
    # The request is one slot (360 KB) and the reply is at most ~20 KB.
    client_max_body_size 1m;
    # One decode measured 1.208 s at cycles=3; the service's own timeout is
    # 10 s, so this only has to be larger than that.
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
}
