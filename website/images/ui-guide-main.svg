  <g><circle class="badge" cx="190" cy="434" r="10"/><text class="badge-txt" x="190" y="434">21</text></g>
  <g><circle class="badge" cx="264" cy="434" r="10"/><text class="badge-txt" x="264" y="434">22</text></g>
  <g><circle class="badge" cx="338" cy="434" r="10"/><text class="badge-txt" x="338" y="434">23</text></g>
  <g><circle class="badge" cx="412" cy="434" r="10"/><text class="badge-txt" x="412" y="434">24</text></g>
