  <g>
    <rect class="btn" x="46" y="606" width="118" height="42"/><text x="105" y="622" class="txt-sm" font-size="10">M1</text><text x="105" y="638" class="txt-sm" font-size="9">7.050</text>
    <rect class="btn" x="172" y="606" width="118" height="42"/><text x="231" y="622" class="txt-sm" font-size="10">M2</text><text x="231" y="638" class="txt-sm" font-size="9">3.850</text>
    <rect class="btn" x="298" y="606" width="118" height="42"/><text x="357" y="622" class="txt-sm" font-size="10">M3</text><text x="357" y="638" class="txt-sm" font-size="9">14.270</text>
    <rect class="btn" x="46" y="654" width="118" height="42"/><text x="105" y="670" class="txt-sm" font-size="10">M4</text><text x="105" y="686" class="txt-sm" font-size="9">21.400</text>
    <rect class="btn" x="172" y="654" width="118" height="42"/><text x="231" y="670" class="txt-sm" font-size="10">M5</text><text x="231" y="686" class="txt-sm" font-size="9">28.450</text>
    <rect class="btn" x="298" y="654" width="118" height="42"/><text x="357" y="670" class="txt-sm" font-size="10">M6</text><text x="357" y="686" class="txt-sm" font-size="9">50.150</text>
  </g>

  <!-- ===== Footer ===== -->
  <rect class="btn-on" x="46" y="708" width="196" height="84" rx="10"/>
  <text x="144" y="752" class="txt-big" text-anchor="middle" font-size="26">PTT</text>
  <rect class="btn" x="250" y="708" width="170" height="38" rx="6"/><text x="335" y="731" class="txt" text-anchor="middle" font-size="12">TUNE</text>
  <rect class="btn" x="250" y="754" width="170" height="38" rx="6"/><text x="335" y="777" class="txt" text-anchor="middle" font-size="12">REC</text>

