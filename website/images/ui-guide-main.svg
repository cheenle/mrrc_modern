<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 840" width="470" height="840" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .phone { fill:#111418; stroke:#3a3f47; stroke-width:3; }
      .screen { fill:#1a1a1a; }
      .panel { fill:#22262c; }
      .border { stroke:#33383f; stroke-width:1; }
      .btn { fill:#2a2e35; stroke:#3d434c; stroke-width:1; rx:6; }
      .btn-on { fill:#3b2f14; stroke:#f59e0b; stroke-width:1; rx:6; }
      .accent { fill:#f59e0b; }
      .green { fill:#22c55e; }
      .red { fill:#ef4444; }
      .txt { fill:#e6e6e6; font-size:13px; }
      .txt-sm { fill:#9aa0a8; font-size:10.5px; }
      .txt-big { fill:#f5f5f5; font-size:24px; font-weight:bold; }
      .lbl { fill:#c9ced6; font-size:10px; }
      .meter-fill { fill:#f59e0b; }
      .dash { stroke:#4a5160; stroke-width:1; stroke-dasharray:4 3; fill:none; }
      .badge { fill:#f59e0b; stroke:#fff; stroke-width:1.5; }
      .badge-txt { fill:#111; font-size:11.5px; font-weight:bold; text-anchor:middle; dominant-baseline:central; }
      .cap { fill:#777; font-size:11px; }
    </style>
  </defs>

  <!-- Phone frame -->
  <rect class="phone" x="30" y="20" width="410" height="800" rx="28"/>
  <rect class="screen" x="42" y="32" width="386" height="776" rx="4"/>

  <!-- ===== Header ===== -->
  <g>
    <rect class="btn" x="48" y="48" width="30" height="34"/>
    <text x="63" y="68" class="txt" text-anchor="middle" font-size="15">☰</text>
    <rect class="panel border" x="88" y="44" width="150" height="42" rx="4"/>
    <text x="163" y="70" class="txt-big" text-anchor="middle" font-size="21">14.270.00</text>
    <rect class="btn" x="252" y="52" width="26" height="26"/><text x="265" y="69" class="txt" text-anchor="middle">☀</text>
    <rect class="btn" x="282" y="52" width="26" height="26"/><text x="295" y="69" class="txt" text-anchor="middle">⛶</text>
    <rect class="btn" x="312" y="52" width="26" height="26"/><text x="325" y="69" class="txt" text-anchor="middle">⏻</text>
    <text x="362" y="70" class="txt" text-anchor="middle" font-size="11">VFO-A</text>
  </g>

  <!-- ===== Status bar ===== -->
  <rect x="42" y="92" width="386" height="22" fill="#17191c"/>
  <text x="50" y="106" class="txt-sm" font-size="9.5">20m USB RX ●Serial ↓0↑0 RTT-- J--</text>

  <!-- ===== Spectrum ===== -->
  <rect class="panel" x="46" y="120" width="378" height="26" rx="3"/>
  <text x="235" y="136" class="txt-sm" text-anchor="middle" font-size="9">FFT 频谱</text>
  <rect class="panel" x="46" y="148" width="378" height="46" rx="3"/>
  <text x="235" y="172" class="txt-sm" text-anchor="middle" font-size="9">瀑布图</text>
  <rect class="panel" x="46" y="196" width="378" height="20" rx="3"/>
  <text x="235" y="210" class="txt-sm" text-anchor="middle" font-size="8.5">— 频率刻度 —</text>

  <!-- ===== S-meter ===== -->
  <rect class="panel border" x="46" y="222" width="290" height="34" rx="3"/>
  <rect x="54" y="230" width="274" height="18" rx="9" fill="#1c2026"/>
  <rect x="54" y="230" width="170" height="18" rx="9" class="meter-fill" opacity="0.85"/>
  <text x="346" y="242" class="txt" font-size="13">S0</text>
  <text x="346" y="254" class="txt-sm" font-size="8.5">-54 dB</text>
  <text x="52" y="266" class="txt-sm" font-size="7.5">S1 S3 S5 S7 S9 +20 +40 +60</text>

  <!-- ===== Meters ===== -->
  <g>
    <rect class="panel border" x="46" y="272" width="182" height="34" rx="3"/>
    <text x="54" y="288" class="lbl">PWR</text><rect x="84" y="280" width="110" height="8" fill="#1c2026"/>
    <rect x="84" y="280" width="30" height="8" class="meter-fill"/><text x="200" y="288" class="txt-sm" font-size="9">0 W</text>
    <rect class="panel border" x="236" y="272" width="188" height="34" rx="3"/>
    <text x="244" y="288" class="lbl">ALC</text><rect x="276" y="280" width="110" height="8" fill="#1c2026"/>
    <rect x="276" y="280" width="10" height="8" class="meter-fill" opacity="0.6"/><text x="396" y="288" class="txt-sm" font-size="9">0</text>
    <rect class="panel border" x="46" y="312" width="120" height="34" rx="3"/>
    <text x="54" y="328" class="lbl">SWR</text><rect x="84" y="320" width="60" height="8" fill="#1c2026"/>
    <rect x="84" y="320" width="14" height="8" class="green"/><text x="146" y="328" class="txt-sm" font-size="9">1.0</text>
    <rect class="panel border" x="174" y="312" width="120" height="34" rx="3"/>
    <text x="182" y="328" class="lbl">Id</text><rect x="200" y="320" width="60" height="8" fill="#1c2026"/>
    <rect x="200" y="320" width="6" height="8" class="meter-fill" opacity="0.5"/><text x="270" y="328" class="txt-sm" font-size="9">—</text>
    <rect class="panel border" x="302" y="312" width="122" height="34" rx="3"/>
    <text x="310" y="328" class="lbl">Vd</text><rect x="330" y="320" width="60" height="8" fill="#1c2026"/>
    <rect x="330" y="320" width="40" height="8" class="meter-fill" opacity="0.8"/><text x="400" y="328" class="txt-sm" font-size="9">13.8 V</text>
    <rect x="46" y="352" width="378" height="34" rx="3" class="dash"/>
    <text x="54" y="372" class="txt-sm" font-size="9">ATR · SWR · LC L=x C=y · TUNE（可选外接天调，未启用时隐藏）</text>
  </g>

  <!-- ===== Quick controls ===== -->
  <g>
    <rect class="btn" x="46" y="396" width="68" height="34"/><text x="80" y="417" class="txt" text-anchor="middle" font-size="12">USB</text>
    <rect class="btn" x="120" y="396" width="68" height="34"/><text x="154" y="417" class="txt" text-anchor="middle" font-size="12">20m</text>
    <rect class="btn" x="194" y="396" width="68" height="34"/><text x="228" y="417" class="txt" text-anchor="middle" font-size="12">2.4k</text>
    <rect class="btn" x="268" y="396" width="68" height="34"/><text x="302" y="417" class="txt" text-anchor="middle" font-size="12">ATT</text>
    <rect class="btn" x="342" y="396" width="68" height="34"/><text x="376" y="417" class="txt" text-anchor="middle" font-size="12">PRE</text>
  </g>

  <!-- ===== DSP ===== -->
  <g>
    <rect class="btn" x="46" y="436" width="68" height="34"/><text x="80" y="457" class="txt" text-anchor="middle" font-size="12">NR</text>
    <rect class="btn" x="120" y="436" width="68" height="34"/><text x="154" y="457" class="txt" text-anchor="middle" font-size="12">NB</text>
    <rect class="btn" x="194" y="436" width="68" height="34"/><text x="228" y="457" class="txt" text-anchor="middle" font-size="12">AN</text>
