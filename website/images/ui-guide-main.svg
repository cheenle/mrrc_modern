  <g><circle class="badge" cx="108" cy="516" r="10"/><text class="badge-txt" x="108" y="516">26</text></g>
  <g><circle class="badge" cx="174" cy="516" r="10"/><text class="badge-txt" x="174" y="516">27</text></g>
