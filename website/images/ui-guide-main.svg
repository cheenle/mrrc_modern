  <text x="54" y="497" class="lbl" font-size="10.5">🔊 Vol</text>
  <rect x="150" y="488" width="220" height="10" rx="5" fill="#1c2026"/>
  <rect x="150" y="488" width="130" height="10" rx="5" class="meter-fill" opacity="0.7"/>
  <text x="392" y="497" class="txt-sm" font-size="9.5">128</text>

