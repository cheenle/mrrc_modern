  <g>
    <rect class="btn-on" x="46" y="562" width="88" height="34"/><text x="90" y="583" class="txt" text-anchor="middle" font-size="11.5">VFO-A</text>
    <rect class="btn" x="140" y="562" width="88" height="34"/><text x="184" y="583" class="txt" text-anchor="middle" font-size="11.5">VFO-B</text>
