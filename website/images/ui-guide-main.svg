  <g>
    <rect class="btn" x="46" y="518" width="60" height="36"/><text x="76" y="539" class="txt" text-anchor="middle" font-size="12">◀◀</text>
    <rect class="btn" x="112" y="518" width="60" height="36"/><text x="142" y="539" class="txt" text-anchor="middle" font-size="12">◀</text>
    <rect class="btn-on" x="178" y="518" width="88" height="36"/><text x="222" y="539" class="txt" text-anchor="middle" font-size="12">1kHz</text>
    <rect class="btn" x="272" y="518" width="60" height="36"/><text x="302" y="539" class="txt" text-anchor="middle" font-size="12">▶</text>
    <rect class="btn" x="338" y="518" width="60" height="36"/><text x="368" y="539" class="txt" text-anchor="middle" font-size="12">▶▶</text>
