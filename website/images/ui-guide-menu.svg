<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 934" width="470" height="934" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <!-- diagram-version: V2.88 -->
  <defs>
    <style>
      .panel { fill:#22262c; }
      .border { stroke:#33383f; stroke-width:1; }
      .row { fill:#2a2e35; stroke:#3d434c; stroke-width:1; }
      .txt { fill:#e6e6e6; font-size:13px; }
      .txt-sm { fill:#9aa0a8; font-size:10.5px; }
      .lbl { fill:#c9ced6; font-size:11px; }
      .accent { fill:#f59e0b; }
      .sel { fill:#1c2026; stroke:#4a5160; stroke-width:1; }
      .badge { fill:#f59e0b; stroke:#fff; stroke-width:1.5; }
      .badge-txt { fill:#111; font-size:11.5px; font-weight:bold; text-anchor:middle; dominant-baseline:central; }
      .cap { fill:#777; font-size:11px; }
    </style>
  </defs>

  <!-- Panel -->
  <rect class="panel border" x="40" y="20" width="390" height="970" rx="14"/>

  <!-- Header -->
  <text x="60" y="56" class="txt" font-size="16" font-weight="bold">MRRC Modern 菜单</text>
  <text x="404" y="56" class="txt" text-anchor="end" font-size="18">✕</text>
  <line x1="54" y1="72" x2="416" y2="72" stroke="#33383f" stroke-width="1"/>

  <!-- Menu list -->
  <g>
    <rect class="row" x="56" y="84" width="358" height="42" rx="6"/><text x="70" y="110" class="txt">Band Selection</text>
    <rect class="row" x="56" y="132" width="358" height="42" rx="6"/><text x="70" y="158" class="txt">Mode Selection</text>
    <rect class="row" x="56" y="180" width="358" height="42" rx="6"/><text x="70" y="206" class="txt">Memory Manager</text>
    <rect class="row" x="56" y="228" width="358" height="42" rx="6"/><text x="70" y="254" class="txt">Advanced Settings</text>
    <rect class="row" x="56" y="276" width="358" height="42" rx="6"/><text x="70" y="302" class="txt">连接设置…</text>
    <rect class="row" x="56" y="324" width="358" height="42" rx="6"/><text x="70" y="350" class="txt">接入云端（Cloud Hub）…</text>
    <rect class="row" x="56" y="372" width="358" height="42" rx="6"/><text x="70" y="398" class="txt">重开电台（自动尝试唤醒）…</text>
    <rect class="row" x="56" y="420" width="358" height="42" rx="6"/><text x="70" y="446" class="txt">关机（保持关闭）…</text>
    <rect class="row" x="56" y="468" width="358" height="42" rx="6"/><text x="70" y="494" class="txt">录音 Recordings</text>
    <rect class="row" x="56" y="516" width="358" height="42" rx="6"/><text x="70" y="542" class="txt">🐞 遇到问题</text>
    <rect class="row" x="56" y="564" width="358" height="42" rx="6"/><text x="70" y="590" class="txt" fill="#ef4444">Logout</text>
  </g>

  <line x1="54" y1="570" x2="416" y2="570" stroke="#33383f" stroke-width="1"/>
  <text x="60" y="640" class="txt" font-size="13" fill="#f59e0b">Settings（设置面板）</text>

  <!-- SPAN / SPD row -->
  <text x="60" y="674" class="lbl">SPAN</text>
  <rect class="sel" x="100" y="660" width="110" height="24" rx="4"/><text x="155" y="676" class="txt-sm" text-anchor="middle">100k ▾</text>
  <text x="226" y="674" class="lbl">SPD</text>
  <rect class="sel" x="260" y="660" width="110" height="24" rx="4"/><text x="315" y="676" class="txt-sm" text-anchor="middle">3 ▾</text>

  <!-- Color -->
  <text x="60" y="716" class="lbl">Color</text>
  <rect class="sel" x="100" y="702" width="270" height="24" rx="4"/><text x="235" y="718" class="txt-sm" text-anchor="middle">Jet ▾</text>

  <!-- NET（频谱带宽档位） -->
  <text x="60" y="758" class="lbl">NET</text>
  <rect class="sel" x="100" y="744" width="270" height="24" rx="4"/><text x="235" y="760" class="txt-sm" text-anchor="middle">Full ▾</text>

  <!-- Floor -->
  <text x="60" y="800" class="lbl">Floor</text>
  <rect x="100" y="792" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="792" width="24" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="800" class="txt-sm" font-size="9.5">5</text>

  <!-- Ceil -->
  <text x="60" y="842" class="lbl">Ceil</text>
  <rect x="100" y="834" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="834" width="170" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="842" class="txt-sm" font-size="9.5">220</text>

  <!-- RF Gain -->
  <text x="60" y="884" class="lbl">RF Gain</text>
  <rect x="100" y="876" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="876" width="200" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="884" class="txt-sm" font-size="9.5">100%</text>

  <!-- Mic -->
  <text x="60" y="926" class="lbl">Mic</text>
  <rect x="100" y="918" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="918" width="100" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="926" class="txt-sm" font-size="9.5">51</text>

  <!-- 🎙 Vol -->
  <text x="60" y="968" class="lbl">🎙 Vol</text>
  <rect x="100" y="960" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="960" width="140" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="968" class="txt-sm" font-size="9.5">100</text>

  <!-- Badges -->
  <g><circle class="badge" cx="416" cy="180" r="10"/><text class="badge-txt" x="416" y="180">40</text></g>
  <g><circle class="badge" cx="416" cy="228" r="10"/><text class="badge-txt" x="416" y="228">41</text></g>
  <g><circle class="badge" cx="416" cy="276" r="10"/><text class="badge-txt" x="416" y="276">42</text></g>
  <g><circle class="badge" cx="416" cy="324" r="10"/><text class="badge-txt" x="416" y="324">43</text></g>
  <g><circle class="badge" cx="416" cy="372" r="10"/><text class="badge-txt" x="416" y="372">44</text></g>
  <g><circle class="badge" cx="212" cy="658" r="10"/><text class="badge-txt" x="212" y="658">45</text></g>
  <g><circle class="badge" cx="372" cy="658" r="10"/><text class="badge-txt" x="372" y="658">46</text></g>
  <g><circle class="badge" cx="372" cy="700" r="10"/><text class="badge-txt" x="372" y="700">47</text></g>
  <g><circle class="badge" cx="312" cy="790" r="10"/><text class="badge-txt" x="312" y="790">48</text></g>
  <g><circle class="badge" cx="312" cy="832" r="10"/><text class="badge-txt" x="312" y="832">49</text></g>
  <g><circle class="badge" cx="312" cy="874" r="10"/><text class="badge-txt" x="312" y="874">50</text></g>
  <g><circle class="badge" cx="312" cy="916" r="10"/><text class="badge-txt" x="312" y="916">51</text></g>
  <g><circle class="badge" cx="312" cy="958" r="10"/><text class="badge-txt" x="312" y="958">52</text></g>

  <text x="235" y="1012" class="cap" text-anchor="middle">图 2 · 左侧抽屉菜单（点 ☰ 打开）控件编号图</text>
</svg>
