<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 700" width="470" height="700" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <style>
      .panel { fill:#22262c; }
      .border { stroke:#33383f; stroke-width:1; }
      .row { fill:#2a2e35; stroke:#3d434c; stroke-width:1; }
      .txt { fill:#e6e6e6; font-size:13px; }
      .txt-sm { fill:#9aa0a8; font-size:10.5px; }
      .lbl { fill:#c9ced6; font-size:11px; }
      .accent { fill:#f59e0b; }
      .sel { fill:#1c2026; stroke:#4a5160; stroke-width:1; }
      .badge { fill:#f59e0b; stroke:#fff; stroke-width:1.5; }
      .badge-txt { fill:#111; font-size:11.5px; font-weight:bold; text-anchor:middle; dominant-baseline:central; }
      .cap { fill:#777; font-size:11px; }
    </style>
  </defs>

  <!-- Panel -->
  <rect class="panel border" x="40" y="20" width="390" height="640" rx="14"/>

  <!-- Header -->
  <text x="60" y="56" class="txt" font-size="16" font-weight="bold">FT-710 Menu</text>
  <text x="404" y="56" class="txt" text-anchor="end" font-size="18">✕</text>
  <line x1="54" y1="72" x2="416" y2="72" stroke="#33383f" stroke-width="1"/>

  <!-- Menu list -->
  <g>
    <rect class="row" x="56" y="84" width="358" height="42" rx="6"/><text x="70" y="110" class="txt">Band Selection</text>
    <rect class="row" x="56" y="132" width="358" height="42" rx="6"/><text x="70" y="158" class="txt">Mode Selection</text>
    <rect class="row" x="56" y="180" width="358" height="42" rx="6"/><text x="70" y="206" class="txt">Memory Manager</text>
    <rect class="row" x="56" y="228" width="358" height="42" rx="6"/><text x="70" y="254" class="txt">Advanced Settings</text>
    <rect class="row" x="56" y="276" width="358" height="42" rx="6"/><text x="70" y="302" class="txt" fill="#ef4444">Logout</text>
  </g>

  <line x1="54" y1="330" x2="416" y2="330" stroke="#33383f" stroke-width="1"/>
  <text x="60" y="352" class="txt" font-size="13" fill="#f59e0b">Settings（设置面板）</text>

  <!-- SPAN / SPD row -->
  <text x="60" y="386" class="lbl">SPAN</text>
  <rect class="sel" x="100" y="372" width="110" height="24" rx="4"/><text x="155" y="388" class="txt-sm" text-anchor="middle">100k ▾</text>
  <text x="226" y="386" class="lbl">SPD</text>
  <rect class="sel" x="260" y="372" width="110" height="24" rx="4"/><text x="315" y="388" class="txt-sm" text-anchor="middle">3 ▾</text>

  <!-- Color -->
  <text x="60" y="428" class="lbl">Color</text>
  <rect class="sel" x="100" y="414" width="270" height="24" rx="4"/><text x="235" y="430" class="txt-sm" text-anchor="middle">Jet ▾</text>

  <!-- Floor -->
  <text x="60" y="470" class="lbl">Floor</text>
  <rect x="100" y="462" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="462" width="24" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="470" class="txt-sm" font-size="9.5">5</text>

  <!-- Ceil -->
  <text x="60" y="512" class="lbl">Ceil</text>
  <rect x="100" y="504" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="504" width="170" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="512" class="txt-sm" font-size="9.5">220</text>

  <!-- RF Gain -->
  <text x="60" y="554" class="lbl">RF Gain</text>
  <rect x="100" y="546" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="546" width="200" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="554" class="txt-sm" font-size="9.5">100%</text>

  <!-- Mic -->
  <text x="60" y="596" class="lbl">Mic</text>
  <rect x="100" y="588" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="588" width="100" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="596" class="txt-sm" font-size="9.5">50</text>

  <!-- 🎙 Vol -->
  <text x="60" y="638" class="lbl">🎙 Vol</text>
  <rect x="100" y="630" width="210" height="8" rx="4" fill="#1c2026"/><rect x="100" y="630" width="140" height="8" rx="4" class="accent" opacity="0.7"/>
  <text x="330" y="638" class="txt-sm" font-size="9.5">100</text>

  <!-- Badges -->
  <g><circle class="badge" cx="416" cy="84" r="10"/><text class="badge-txt" x="416" y="84">39</text></g>
  <g><circle class="badge" cx="416" cy="132" r="10"/><text class="badge-txt" x="416" y="132">40</text></g>
  <g><circle class="badge" cx="416" cy="180" r="10"/><text class="badge-txt" x="416" y="180">41</text></g>
  <g><circle class="badge" cx="416" cy="228" r="10"/><text class="badge-txt" x="416" y="228">42</text></g>
  <g><circle class="badge" cx="416" cy="276" r="10"/><text class="badge-txt" x="416" y="276">43</text></g>
  <g><circle class="badge" cx="212" cy="370" r="10"/><text class="badge-txt" x="212" y="370">44</text></g>
  <g><circle class="badge" cx="372" cy="370" r="10"/><text class="badge-txt" x="372" y="370">45</text></g>
  <g><circle class="badge" cx="372" cy="412" r="10"/><text class="badge-txt" x="372" y="412">46</text></g>
  <g><circle class="badge" cx="312" cy="460" r="10"/><text class="badge-txt" x="312" y="460">47</text></g>
  <g><circle class="badge" cx="312" cy="502" r="10"/><text class="badge-txt" x="312" y="502">48</text></g>
  <g><circle class="badge" cx="312" cy="544" r="10"/><text class="badge-txt" x="312" y="544">49</text></g>
  <g><circle class="badge" cx="312" cy="586" r="10"/><text class="badge-txt" x="312" y="586">50</text></g>
  <g><circle class="badge" cx="312" cy="628" r="10"/><text class="badge-txt" x="312" y="628">51</text></g>

  <text x="235" y="682" class="cap" text-anchor="middle">图 2 · 左侧抽屉菜单（点 ☰ 打开）控件编号图</text>
</svg>
