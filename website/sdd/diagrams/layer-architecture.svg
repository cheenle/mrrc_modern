<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340">
  <defs>
    <linearGradient id="layerGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f0a03022"/><stop offset="100%" stop-color="#f0a03008"/></linearGradient>
    <linearGradient id="appGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5dade222"/><stop offset="100%" stop-color="#5dade208"/></linearGradient>
  </defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.t{fill:#e0e0e0;font-size:12px;font-weight:500}.h{fill:#f0a030;font-size:11px;font-weight:600}.m{fill:#888;font-size:10px}</style>
  <!-- Client Layer -->
  <rect x="120" y="16" width="360" height="56" rx="8" fill="url(#layerGrad)" stroke="#f0a03055"/>
  <text x="300" y="36" text-anchor="middle" class="h">CLIENT LAYER</text>
  <text x="300" y="54" text-anchor="middle" class="t">Mobile browser UI · Web Audio API · WebSocket · Service Worker</text>
  <!-- Arrow -->
  <line x1="300" y1="72" x2="300" y2="86" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- App Layer -->
  <rect x="100" y="88" width="400" height="56" rx="8" fill="url(#appGrad)" stroke="#5dade255"/>
  <text x="300" y="108" text-anchor="middle" class="h">APPLICATION LAYER</text>
  <text x="300" y="126" text-anchor="middle" class="t">FastAPI · Static Files · 4× WebSocket · Auth · Fan-out</text>
  <!-- Arrow -->
  <line x1="300" y1="144" x2="300" y2="158" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Radio Layer -->
  <rect x="100" y="160" width="400" height="56" rx="8" fill="url(#layerGrad)" stroke="#f0a03055"/>
  <text x="300" y="180" text-anchor="middle" class="h">RADIO LAYER</text>
  <text x="300" y="198" text-anchor="middle" class="t">Serial CAT (pyserial) · FT4222 SPI (subprocess) · PyAudio I/O</text>
  <!-- Arrow -->
  <line x1="300" y1="216" x2="300" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Codec Layer -->
  <rect x="140" y="232" width="320" height="44" rx="8" fill="url(#layerGrad)" stroke="#a78bfa55"/>
  <text x="300" y="252" text-anchor="middle" class="h">CODEC LAYER</text>
  <text x="300" y="266" text-anchor="middle" class="t">Opus encode/decode (libopus ctypes) · Int16 PCM fallback</text>
  <!-- Arrow -->
  <line x1="300" y1="276" x2="300" y2="290" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Device Layer -->
  <rect x="180" y="292" width="240" height="40" rx="8" fill="url(#layerGrad)" stroke="#22c55e55"/>
  <text x="300" y="312" text-anchor="middle" class="h">DEVICE LAYER</text>
  <text x="300" y="326" text-anchor="middle" class="t">Yaesu FT-710 via USB (CAT + SPI + Audio)</text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#555"/></marker></defs>
</svg>
