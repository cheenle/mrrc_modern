<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <!-- diagram-version: V2.46 -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#888"/></marker>
  </defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.b{fill:#e0e0e0;font-size:12px;font-weight:600}.h{fill:#f0a030;font-size:10px;font-weight:700;letter-spacing:.05em}.m{fill:#999;font-size:10px}.s{fill:#777;font-size:9px}</style>

  <text x="380" y="18" text-anchor="middle" class="b">Logical Architecture (SDD V2.46)</text>

  <!-- Browser -->
  <rect x="250" y="30" width="260" height="48" rx="10" fill="#f0a03018" stroke="#f0a03055"/>
  <text x="380" y="50" text-anchor="middle" class="b">Browser (mobile-first SPA)</text>
  <text x="380" y="66" text-anchor="middle" class="m">waterfall · S-meter · meters · PTT · recordings panel · settings</text>

  <line x1="380" y1="78" x2="380" y2="96" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <text x="392" y="91" class="m">HTTP / WS (token per channel)</text>

  <!-- Server -->
  <rect x="60" y="100" width="640" height="104" rx="10" fill="#5dade218" stroke="#5dade255"/>
  <text x="74" y="118" class="h">SERVER · server.py (FastAPI + lifespan)</text>
  <text x="74" y="136" class="m">WS: /WSradio · /WSspectrum · /WSaudioRX · /WSaudioTX · /WSatr1000 (optional)</text>
  <text x="74" y="151" class="m">REST: /api/auth · /api/setup · /api/mem_channels · /api/recordings · /api/status</text>
  <text x="74" y="166" class="m">state fan-out (dirty fields) · TX-uplink ownership = PTT client · PTT/max-TX watchdogs · auth tokens</text>
  <text x="74" y="184" class="m">radio_state.py (dirty tracking · derived properties) · poll_scheduler.py (7 tasks, 100 ms-5 s, skip-on-command)</text>
  <text x="74" y="199" class="m">recorder.py (16 kHz MP3 writer) · atr1000_client.py (optional tuner) · audio_handler.py + opus_rx.py + audio_resample.py</text>

  <line x1="380" y1="204" x2="380" y2="222" stroke="#888" stroke-width="2" marker-end="url(#arr)"/>
  <text x="392" y="217" class="m">backends.create_backend(model) — registry of 10 keys</text>

  <!-- Backends -->
  <rect x="60" y="226" width="640" height="66" rx="10" fill="#22c55e18" stroke="#22c55e55"/>
  <text x="74" y="244" class="h">BACKENDS · RadioBackend ABC + RadioCapabilities</text>
  <text x="74" y="262" class="m">backends/ft710/ — CatController (ASCII CAT, verified) + scope_pipe subprocess (FT4222)</text>
  <text x="74" y="277" class="m">backends/ic7300/ — civ_controller + civ_codec + civ_profiles + civ_scope (CI-V family, profile-driven)</text>
  <text x="74" y="292" class="m">backends/yaesu/ — cat_core + yaesu_profiles + backend (ASCII-CAT family, profile-driven, TX gated)</text>

  <!-- Devices -->
  <rect x="60" y="300" width="640" height="34" rx="10" fill="#e0e0e018" stroke="#e0e0e055"/>
  <text x="74" y="318" class="h">DEVICES</text>
  <text x="140" y="318" class="m">USB serial (CAT / CI-V) · FT4222 SPI · CI-V 0x27 · USB audio · optional ATR1000 tuner over the network</text>
</svg>
