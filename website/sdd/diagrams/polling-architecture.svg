<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 540">
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f0a030"/></marker></defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.h{fill:#f0a030;font-size:10px;font-weight:600}.t{fill:#e0e0e0;font-size:9px}.m{fill:#888;font-size:8px}.c{fill:#5dade2;font-size:9px}</style>
  <text x="16" y="18" fill="#f0a030" font-size="14" font-weight="700">Polling Architecture — 7-Task Adaptive Scheduler</text>

  <!-- PollScheduler box -->
  <rect x="16" y="30" width="628" height="500" rx="10" fill="none" stroke="#f0a03022"/>
  <text x="330" y="44" text-anchor="middle" fill="#f0a030" font-size="10">PollScheduler (asyncio)</text>

  <!-- Tier 1 -->
  <rect x="36" y="54" width="280" height="50" rx="6" fill="#f0a03010" stroke="#f0a03033"/>
  <text x="50" y="72" class="h">Tier 1 · 100ms</text>
  <text x="50" y="88" class="t">FA; MD0; SM0; → vfo_a_freq, mode, s_meter</text>
  <text x="50" y="100" class="m">IF poll — highest frequency, drives VFO display + S-meter</text>

  <rect x="336" y="54" width="288" height="50" rx="6" fill="#f0a03010" stroke="#f0a03033"/>
  <text x="350" y="72" class="h">Tier 1b · 500ms</text>
  <text x="350" y="88" class="t">VS; FB; → active_vfo, vfo_b_freq</text>
  <text x="350" y="100" class="m">VFO tracking — follows active-VFO changes</text>

  <!-- Tier 2 -->
  <rect x="36" y="118" width="280" height="50" rx="6" fill="#5dade210" stroke="#5dade233"/>
  <text x="50" y="136" class="h">Tier 2A · 500ms (TX only)</text>
  <text x="50" y="152" class="t">RM3; RM4; RM5; RM6; → comp, alc, pwr, swr</text>
  <text x="50" y="164" class="m">TX meters — calibrated piecewise-linear from FT-710.rig</text>

  <rect x="336" y="118" width="288" height="50" rx="6" fill="#5dade210" stroke="#5dade233"/>
  <text x="350" y="136" class="h">Tier 2B · 500ms</text>
  <text x="350" y="152" class="t">TX; → tx_status</text>
  <text x="350" y="164" class="m">TX status — drives PTT safety watchdog</text>

  <!-- Tier 3 -->
  <rect x="36" y="182" width="588" height="50" rx="6" fill="#a78bfa10" stroke="#a78bfa33"/>
  <text x="50" y="200" class="h">Tier 3 · 2s (13 fields, stale-read guarded)</text>
  <text x="50" y="216" class="t">SH0; AG0; RG0; PC; PA0; RA0; NB0; NR0; BC; AC; SS01; AN; GT; MS; PS;</text>
  <text x="50" y="228" class="m">filter/gains/preamp/att/NR/NB/AN/tuner/scope/antenna/agc/meter_display — re-checks skip AFTER each query response</text>

  <!-- Tier 4 -->
  <rect x="36" y="246" width="588" height="50" rx="6" fill="#22c55e10" stroke="#22c55e33"/>
  <text x="50" y="264" class="h">Tier 4 · 5s (slow telemetry)</text>
  <text x="50" y="280" class="t">RM7; RM8; PR; CO; AO; RI0; → id, vd, compressor, contour, amc, radio-info</text>
  <text x="50" y="292" class="m">Slow-changing meters + radio identity</text>

  <!-- Tier 5 -->
  <rect x="36" y="310" width="588" height="50" rx="6" fill="#e74c3c10" stroke="#e74c3c33"/>
  <text x="50" y="328" class="h">Tier 5 · 1s (connection watchdog)</text>
  <text x="50" y="344" class="t">ID; query → reconnect + full-state re-sync + scope re-init (on_reconnected hook)</text>
  <text x="50" y="356" class="m">Auto-recover from USB disconnects; re-runs EX040101/EX040200 after successful reconnect</text>

  <!-- Bottom notes -->
  <rect x="36" y="380" width="588" height="80" rx="6" fill="#f0a03008" stroke="#f0a03022"/>
  <text x="330" y="398" text-anchor="middle" class="h">User Commands &amp; Priority Preemption</text>
  <text x="330" y="414" text-anchor="middle" class="t">skip_next_poll(field, duration) · _cancel_polls for PTT/TUNE · send_priority_set_command</text>
  <text x="330" y="430" text-anchor="middle" class="t">Stale-read guard: poll loop re-checks skip AFTER each in-flight query response and discards stale data</text>
  <text x="330" y="446" text-anchor="middle" class="t">CAT I/O serialized via CatController._lock · blocking work offloaded to asyncio.to_thread()</text>

  <rect x="36" y="472" width="588" height="50" rx="6" fill="#88888810" stroke="#88888822"/>
  <text x="330" y="490" text-anchor="middle" class="h">Adaptive Rate Scaling</text>
  <text x="330" y="506" text-anchor="middle" class="t">Active clients → 1× multiplier (100ms IF) · No clients → 4× (400ms IF) · 0.25s per-query timeout</text>
</svg>
