<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#f0a030"/></marker></defs>
  <style>text{font-family:Inter,-apple-system,sans-serif}.h{fill:#f0a030;font-size:11px;font-weight:600}.t{fill:#e0e0e0;font-size:10px}.m{fill:#888;font-size:9px}</style>
  <text x="16" y="20" fill="#f0a030" font-size="14" font-weight="700">State Broadcasting — Dirty-Field Change Tracking</text>

  <rect x="16" y="34" width="180" height="44" rx="6" fill="#f0a03010" stroke="#f0a03033"/>
  <text x="106" y="52" text-anchor="middle" class="h">Command or Poll</text>
  <text x="106" y="66" text-anchor="middle" class="m">User action or poll cycle</text>
  <line x1="196" y1="56" x2="224" y2="56" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="228" y="34" width="180" height="44" rx="6" fill="#5dade210" stroke="#5dade233"/>
  <text x="318" y="52" text-anchor="middle" class="h">RadioState.update()</text>
  <text x="318" y="66" text-anchor="middle" class="m">field=value → _dirty_fields</text>
  <line x1="408" y1="56" x2="436" y2="56" stroke="#f0a030" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="440" y="34" width="180" height="44" rx="6" fill="#a78bfa10" stroke="#a78bfa33"/>
  <text x="530" y="52" text-anchor="middle" class="h">_broadcast_state()</text>
  <text x="530" y="66" text-anchor="middle" class="m">get_and_clear_dirty()</text>

  <!-- Arrow down + fan out -->
  <line x1="530" y1="78" x2="530" y2="96" stroke="#f0a030" stroke-width="1.5"/>
  <text x="545" y="92" class="m">stateUpdate JSON</text>

  <rect x="40" y="100" width="120" height="36" rx="6" fill="#22c55e10" stroke="#22c55e33"/>
  <text x="100" y="116" text-anchor="middle" class="h">Client 1</text>
  <text x="100" y="130" text-anchor="middle" class="m">renderUpdates()</text>

  <rect x="200" y="100" width="120" height="36" rx="6" fill="#22c55e10" stroke="#22c55e33"/>
  <text x="260" y="116" text-anchor="middle" class="h">Client 2</text>
  <text x="260" y="130" text-anchor="middle" class="m">renderUpdates()</text>

  <rect x="360" y="100" width="120" height="36" rx="6" fill="#22c55e10" stroke="#22c55e33"/>
  <text x="420" y="116" text-anchor="middle" class="h">Client 3</text>
  <text x="420" y="130" text-anchor="middle" class="m">renderUpdates()</text>

  <rect x="520" y="100" width="100" height="36" rx="6" fill="#88888810" stroke="#88888822"/>
  <text x="570" y="116" text-anchor="middle" class="h">Client N</text>
  <text x="570" y="130" text-anchor="middle" class="m">...</text>

  <!-- Lines from broadcast to clients -->
  <line x1="530" y1="96" x2="100" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="530" y1="96" x2="260" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="530" y1="96" x2="420" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="530" y1="96" x2="570" y2="100" stroke="#888" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Bottom note -->
  <rect x="16" y="152" width="608" height="36" rx="6" fill="#f0a03008" stroke="#f0a03022"/>
  <text x="320" y="168" text-anchor="middle" class="t">Only changed fields are transmitted · dirty-field tracking minimizes bandwidth · efficient multi-client fan-out</text>
  <text x="320" y="182" text-anchor="middle" class="m">to_dirty_dict(dirty) → {type:"stateUpdate", fields:{...}, dirty:[...]} → ws.send_text(json.dumps(update))</text>
</svg>
