<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300">
  <!-- diagram-version: V2.46 -->
  <style>text{font-family:Inter,-apple-system,sans-serif}.b{fill:#e0e0e0;font-size:12px;font-weight:600}.h{fill:#f0a030;font-size:10px;font-weight:700}.m{fill:#999;font-size:9.5px}.s{fill:#777;font-size:9px}</style>

  <text x="380" y="18" text-anchor="middle" class="b">Subject Area Model (SDD V2.46)</text>

  <g>
    <rect x="12" y="30" width="180" height="56" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
    <text x="22" y="48" class="h">ClientSession</text>
    <text x="22" y="64" class="m">WS memberships (5 channels)</text>
    <text x="22" y="78" class="m">TX-uplink ownership · UI state</text>

    <rect x="202" y="30" width="180" height="56" rx="9" fill="#5dade218" stroke="#5dade255"/>
    <text x="212" y="48" class="h">RadioBackend</text>
    <text x="212" y="64" class="m">10 registry keys → 3 families</text>
    <text x="212" y="78" class="m">capabilities · poll items · gate</text>

    <rect x="392" y="30" width="180" height="56" rx="9" fill="#5dade218" stroke="#5dade255"/>
    <text x="402" y="48" class="h">ModelProfile</text>
    <text x="402" y="64" class="m">modes/filters/bands/meters</text>
    <text x="402" y="78" class="m">provenance · verified flag</text>

    <rect x="582" y="30" width="166" height="56" rx="9" fill="#22c55e18" stroke="#22c55e55"/>
    <text x="592" y="48" class="h">RadioControl</text>
    <text x="592" y="64" class="m">CAT: freq/mode/PTT/gains</text>
    <text x="592" y="78" class="m">memory channels · tuner</text>
  </g>

  <g>
    <rect x="12" y="98" width="180" height="56" rx="9" fill="#a78bfa18" stroke="#a78bfa55"/>
    <text x="22" y="116" class="h">RadioState</text>
    <text x="22" y="132" class="m">dirty-field change tracking</text>
    <text x="22" y="146" class="m">derived properties (band, S)</text>

    <rect x="202" y="98" width="180" height="56" rx="9" fill="#a78bfa18" stroke="#a78bfa55"/>
    <text x="212" y="116" class="h">PollingSystem</text>
    <text x="212" y="132" class="m">7 tasks · 100 ms → 5 s</text>
    <text x="212" y="146" class="m">skip-on-command · stale-read drop</text>

    <rect x="392" y="98" width="180" height="56" rx="9" fill="#22c55e18" stroke="#22c55e55"/>
    <text x="402" y="116" class="h">ScopeSystem</text>
    <text x="402" y="132" class="m">FT4222 · CI-V 0x27 · none</text>
    <text x="402" y="146" class="m">S-meter fallback · 30 Hz broadcast</text>

    <rect x="582" y="98" width="166" height="56" rx="9" fill="#22c55e18" stroke="#22c55e55"/>
    <text x="592" y="116" class="h">AudioSystem</text>
    <text x="592" y="132" class="m">PyAudio · Opus · WS fan-out</text>
    <text x="592" y="146" class="m">per-model device rate hints</text>
  </g>

  <g>
    <rect x="12" y="166" width="180" height="70" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
    <text x="22" y="184" class="h">RecordingSession</text>
    <text x="22" y="200" class="m">active · started_at · freq_hz</text>
    <text x="22" y="214" class="m">16 kHz mono timeline (RX+TX)</text>
    <text x="22" y="228" class="m">bytes · cursor · drops</text>

    <rect x="202" y="166" width="180" height="70" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
    <text x="212" y="184" class="h">RecordingFile</text>
    <text x="212" y="200" class="m">&lt;freq&gt;kHz_&lt;date&gt;_&lt;time&gt;.mp3</text>
    <text x="212" y="214" class="m">duration · bytes · recording=true</text>
    <text x="212" y="228" class="m">Range streaming · delete (409 while active)</text>

    <rect x="392" y="166" width="180" height="70" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
    <text x="402" y="184" class="h">TunerLinkage (optional)</text>
    <text x="402" y="200" class="m">ATR1000 over its own WS</text>
    <text x="402" y="214" class="m">learned LC store · tune assist</text>
    <text x="402" y="228" class="m">default off: no client, no traffic</text>

    <rect x="582" y="166" width="166" height="70" rx="9" fill="#e0e0e018" stroke="#e0e0e055"/>
    <text x="592" y="184" class="h">OpConfig</text>
    <text x="592" y="200" class="m">port · MODEL · baud · audio devices</text>
    <text x="592" y="214" class="m">auth · TLS · recordings dir</text>
    <text x="592" y="228" class="m">MRRC_* (+ legacy FT710_*)</text>
  </g>

  <text x="380" y="256" text-anchor="middle" class="m">A radio-originated change (CI-V transceive broadcast, front-panel knob) enters the same dirty-field path as a poll-driven change.</text>
  <text x="380" y="272" text-anchor="middle" class="m">Unverified models carry their boundary in the data itself: ModelProfile.verified / unverified_meters / provenance → RadioCapabilities → TX gate + UI badge.</text>
  <text x="380" y="290" text-anchor="middle" class="s">Spectrum and ATR1000 data deliberately stay outside RadioState (separate channels), so a slow producer cannot stall the state fan-out.</text>
</svg>
