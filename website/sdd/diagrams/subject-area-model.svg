  <!-- diagram-version: V3.29 -->
  <style>text{font-family:Inter,-apple-system,sans-serif}.b{fill:#e0e0e0;font-size:14px;font-weight:600}.h{fill:#f0a030;font-size:11px;font-weight:700}.m{fill:#999;font-size:10px}.s{fill:#777;font-size:9px}</style>
  <text x="480" y="20" text-anchor="middle" class="b">Subject Area Model — ownership and persistence</text>
  <rect x="18" y="38" width="220" height="70" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
  <text x="30" y="58" class="h">ClientSession / TerminalSocket</text>
  <text x="30" y="77" class="m">role · sockets · keyer/TX owner</text>
  <text x="30" y="94" class="m">terminal channels · drop counters</text>
  <rect x="250" y="38" width="220" height="70" rx="9" fill="#5dade218" stroke="#5dade255"/>
  <text x="262" y="58" class="h">RadioBackend / Capabilities</text>
  <text x="262" y="77" class="m">15 registry keys · live features</text>
  <text x="262" y="94" class="m">verified · tx_gated · factories</text>
  <rect x="482" y="38" width="220" height="70" rx="9" fill="#5dade218" stroke="#5dade255"/>
  <text x="494" y="58" class="h">Profiles / NetworkSession</text>
  <text x="494" y="77" class="m">provenance · geometry · rates</text>
  <text x="494" y="94" class="m">generation · stream ids · queues</text>
  <rect x="714" y="38" width="228" height="70" rx="9" fill="#22c55e18" stroke="#22c55e55"/>
  <text x="726" y="58" class="h">FlexPan / FlexSlice</text>
  <text x="726" y="77" class="m">owner handle · own_slice/pan</text>
  <text x="726" y="94" class="m">ant_list · dBm aperture · axis</text>
  <rect x="18" y="124" width="220" height="70" rx="9" fill="#a78bfa18" stroke="#a78bfa55"/>
  <text x="30" y="144" class="h">RadioState / PollTier</text>
  <text x="30" y="163" class="m">dirty fields · antenna/AGC/meters</text>
  <text x="30" y="180" class="m">7 tiers · cost pacing · skip/cancel</text>
  <rect x="250" y="124" width="220" height="70" rx="9" fill="#22c55e18" stroke="#22c55e55"/>
  <text x="262" y="144" class="h">ScopeFrame / SpectrumFrame</text>
  <text x="262" y="163" class="m">850 bins · real/fallback source</text>
  <text x="262" y="180" class="m">full/short variants · divider</text>
  <rect x="482" y="124" width="220" height="70" rx="9" fill="#22c55e18" stroke="#22c55e55"/>
  <text x="494" y="144" class="h">AudioChunk / AudioLevels</text>
  <text x="494" y="163" class="m">48 kHz bus · explicit boundaries</text>
  <text x="494" y="180" class="m">mic/listener gains · clipping</text>
  <rect x="714" y="124" width="228" height="70" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
  <text x="726" y="144" class="h">RecordingSession / CQ / FT8</text>
  <text x="726" y="163" class="m">16 kHz MP3 · finite call</text>
  <text x="726" y="180" class="m">UTC ring · worker · cascade</text>
  <rect x="18" y="210" width="220" height="70" rx="9" fill="#5dade218" stroke="#5dade255"/>
  <text x="30" y="230" class="h">MemoryChannel / AuthToken</text>
  <text x="30" y="249" class="m">JSON memories · 30-day token</text>
  <text x="30" y="266" class="m">operator/listen · separate SDR</text>
  <rect x="250" y="210" width="220" height="70" rx="9" fill="#a78bfa18" stroke="#a78bfa55"/>
  <text x="262" y="230" class="h">SdrHub / NanoSweep</text>
  <text x="262" y="249" class="m">tuning hold · demodulator pool</text>
  <text x="262" y="266" class="m">S11 · SWR/Z · exact frames</text>
  <rect x="482" y="210" width="220" height="70" rx="9" fill="#f0a03018" stroke="#f0a03055"/>
  <text x="494" y="230" class="h">SupportBundle / UpdateState</text>
  <text x="494" y="249" class="m">redaction · hashes · warnings</text>
  <text x="494" y="266" class="m">manifest · apply · boot proof</text>
  <rect x="714" y="210" width="228" height="70" rx="9" fill="#e0e0e018" stroke="#e0e0e055"/>
  <text x="726" y="230" class="h">Operational Configuration</text>
  <text x="726" y="249" class="m">env · TLS · audio · network</text>
  <text x="726" y="266" class="m">logs · metrics · tunnel/help</text>
  <rect x="18" y="298" width="924" height="82" rx="10" fill="#e0e0e018" stroke="#e0e0e055"/>
  <text x="480" y="318" text-anchor="middle" class="h">Ownership rules</text>
  <text x="30" y="338" class="m">One session → many sockets; arbitration is per socket · one terminal → four logical channels · one exclusive network engine → many consumers</text>
  <text x="30" y="356" class="m">Native capture → recording/FT8/local; gained copy → listeners · one Flex RX antenna command → hosting pan/SCU; S-meter → owned slice</text>
  <text x="30" y="373" class="s">ModelProfile.verified / unverified_meters / provenance → capabilities and UI; runtime status/read-back remains authoritative</text>
